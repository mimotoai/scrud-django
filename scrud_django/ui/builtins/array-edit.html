<div class="scrud-array scrud-array-edit"><ul>{% for child in children %}<li>{{ child }}</li>{% endfor %}</ul><div class="scrud-append">{% if append_fields %}{% for field in append_fields %}{% if field.type == "boolean" %}<label for="{{ input_id }}-new-{{ forloop.counter }}">{{ field.name }}</label> <input type="checkbox" id="{{ input_id }}-new-{{ forloop.counter }}" name="{{ pointer }}/-/{{ field.name }}">{% else %}<label for="{{ input_id }}-new-{{ forloop.counter }}">{{ field.name }}</label> <input type="text" id="{{ input_id }}-new-{{ forloop.counter }}" name="{{ pointer }}/-/{{ field.name }}">{% endif %}{% endfor %}{% else %}<input type="text" name="{{ pointer }}/-" aria-label="{{ label|default:"New item" }}">{% endif %}</div>{% if errors %}<ul class="scrud-errors" role="alert">{% for error in errors %}<li>{{ error }}</li>{% endfor %}</ul>{% endif %}</div>
