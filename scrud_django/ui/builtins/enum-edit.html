<div class="scrud-field scrud-enum-edit"><label for="{{ input_id }}">{{ label|default:pointer }}</label><select id="{{ input_id }}" name="{{ pointer }}"{% if errors %} aria-invalid="true"{% endif %}>{% with current=value|stringformat:"s" %}{% for option in schema.enum %}{% with o=option|stringformat:"s" %}<option value="{{ o }}"{% if o == current %} selected{% endif %}>{{ o }}</option>{% endwith %}{% endfor %}{% endwith %}</select>{% if errors %}<ul class="scrud-errors" role="alert">{% for error in errors %}<li>{{ error }}</li>{% endfor %}</ul>{% endif %}</div>
