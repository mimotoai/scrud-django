<div class="scrud-field scrud-enum-edit"><label for="f{{ pointer|cut:"/" }}">{{ label|default:pointer }}</label><select id="f{{ pointer|cut:"/" }}" name="{{ pointer }}"{% if errors %} aria-invalid="true"{% endif %}>{% for option in schema.enum %}<option value="{{ option }}"{% if option == value %} selected{% endif %}>{{ option }}</option>{% endfor %}</select>{% if errors %}<ul class="scrud-errors" role="alert">{% for error in errors %}<li>{{ error }}</li>{% endfor %}</ul>{% endif %}</div>
