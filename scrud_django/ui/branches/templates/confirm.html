<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browse branch {{ branch }}?</title>
</head>
<body>
<main class="scrud-branch-confirm">
<h1>You're about to browse branch {{ branch }}</h1>
<p>If you continue, this page is shown as branch <strong>{{ branch }}</strong> ({{ mode }}). A branch's components and styles are written by whoever may write to the branch, and they run in your browser with your rights. Continue only if you trust them.</p>
<p><a class="scrud-branch-continue" href="{{ continue_href }}">Continue</a> <a class="scrud-branch-cancel" href="{{ cancel_href }}">Cancel</a></p>
</main>
</body>
</html>
