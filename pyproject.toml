[project]
name = "scrud-django"
version = "0.12.2"
description = "A Django REST Framework app for Semantic CRUD."
readme = "README.md"
authors = [{ name = "David Charboneau", email = "david@adadabase.com" }]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "django>=5.2,<6.0",
    "django-scoped-rbac[drf]>=0.11.2,<0.12",
    "scrudful[drf]>=0.8,<0.9",
    "djangorestframework>=3.15",
    "django-filter>=25.1",
    "django-reversion>=5.1",
    "jsonpath-ng>=1.6",
    "fastjsonschema>=2.19",
]

[project.optional-dependencies]
search = ["django-haystack>=3.3", "whoosh-reloaded>=2.7.5"]

[project.urls]
Repository = "https://gitlab.com/dcharbon/scrud-django"

[dependency-groups]
dev = [
    "safetydance>=0.5,<0.6",
    "safetydance-django>=0.1,<0.2",
    "pytest",
    "pytest-django",
    "pytest-cov",
    "factory-boy",
    "rdflib",
    "ruff",
    "pre-commit",
    "django-extensions",
    "scrud-django[search]",
    # The PostgreSQL driver for the test suite on PostgreSQL (CI's
    # test-postgres job; tests/settings.py reads SCRUD_TEST_PG_*).
    "psycopg[binary]>=3.2,<4",
]
docs = [
    "sphinx",
    "myst-parser>=5.1,<6",
    "sphinx-rtd-theme",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev"]

[tool.uv.build-backend]
module-root = ""
module-name = "scrud_django"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["tests.py", "test_*.py", "*_tests.py"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["docs/superpowers", ".uv-cache"]

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# Line length is left to the formatter.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests use the safetydance star-import idiom (`from safetydance_django.test import *`,
# `from .steps import *`), which raises F403/F405, and re-declare imported step names
# as nested steps (F811).
"tests/**" = ["F403", "F405", "F811"]
