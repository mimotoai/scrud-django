# Pipelines run for merge requests, tags and the default branch. A branch push
# gets its own pipeline only when it has no open merge request.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim

stages:
  - lint
  - test

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  UV_LINK_MODE: copy
  # Each job tests the interpreter in its image; uv must not fetch another one.
  UV_PYTHON_DOWNLOADS: never

lint:
  stage: lint
  cache:
    key:
      files: [uv.lock]
      prefix: lint
    paths:
      - .uv-cache
  script:
    - uv sync --locked
    - uv run --locked ruff check .
    - uv run --locked ruff format --check .
    - uv run --locked python manage.py makemigrations scrud_django --check --dry-run
  after_script:
    - uv cache prune --ci

docs:
  stage: lint
  cache:
    key:
      files: [uv.lock]
      prefix: docs
    paths:
      - .uv-cache
  script:
    - uv run --locked --group docs sphinx-build -W -b html docs docs/_build
  after_script:
    - uv cache prune --ci

test:
  stage: test
  image: ghcr.io/astral-sh/uv:python$PYTHON-bookworm-slim
  parallel:
    matrix:
      - PYTHON: ["3.11", "3.12", "3.13"]
  cache:
    key:
      files: [uv.lock]
      prefix: test-$PYTHON
    paths:
      - .uv-cache
  script:
    - uv run --locked python -V
    - uv run --locked pytest --cov=scrud_django --cov-report=term --cov-report=xml:coverage.xml
  after_script:
    - uv cache prune --ci
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
